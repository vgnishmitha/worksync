services:
  - type: web
    name: worksync-api
    runtime: node
    rootDir: teamflow-main/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8800
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false

  - type: web
    name: worksync-client
    runtime: static
    rootDir: teamflow-main/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_BASE_URL
        sync: false
